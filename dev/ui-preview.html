<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>悬浮按钮预览（开发用）</title>
    <style>
      body {
        margin: 0;
        font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        background: #f5f5f5;
      }
      .mock {
        max-width: 1180px;
        margin: 0 auto;
        padding: 24px;
      }
      .mock__hero {
        height: 320px;
        border-radius: 12px;
        background: linear-gradient(135deg, #e8eaed, #f7f8fa);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #9aa1ac;
      }
      .mock__row {
        display: flex;
        gap: 16px;
        margin-top: 16px;
      }
      .mock__box {
        flex: 1;
        height: 180px;
        border-radius: 12px;
        background: #eceef1;
      }
    </style>
  </head>
  <body>
    <div class="mock">
      <div class="mock__hero">（这里模拟电商详情页内容）</div>
      <div class="mock__row">
        <div class="mock__box"></div>
        <div class="mock__box"></div>
        <div class="mock__box"></div>
      </div>
    </div>

    <script src="../src/shared/core.js"></script>
    <script src="../src/content/ui.js"></script>
    <script>
      // 点击后模拟一次「提取中 -> 完成」的状态变化
      EMI.ui.mount({
        onClick() {
          EMI.ui.setLoading(true);
          setTimeout(() => {
            EMI.ui.setLoading(false);
            EMI.ui.toast('已提取 26 张图片');
          }, 1200);
        },
      });
    </script>
  </body>
</html>
